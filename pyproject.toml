[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechlens"
version = "0.1.0"
description = "Contrastive speech analytics with temporal flaw grounding"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "praat-parselmouth>=0.4.3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "librosa>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
speechlens = "speechlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
speechlens = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"src/speechlens/analysis/explain.py" = ["E501"]  # human-readable message templates
"src/speechlens/evaluation/run.py" = ["E501"]  # markdown report formatting
"scripts/*.py" = ["E501", "E702", "E731"]  # one-off report/plot helpers
